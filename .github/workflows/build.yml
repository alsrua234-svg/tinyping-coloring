name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Create signing key
        run: |
          mkdir -p keystore
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          keytool -genkeypair -v -keystore keystore/tinyping.jks -alias tinyping -keyalg RSA -keysize 2048 -validity 10000 -storepass tinyping -keypass tinyping -dname "CN=Tinyping, O=Home, C=KR"
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -n -E "error|What went wrong|Exception|FAILED" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk 티니핑색칠놀이.apk
      - uses: actions/upload-artifact@v4
        with: { name: tinyping-apk, path: 티니핑색칠놀이.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 티니핑 색칠놀이 v${{ github.run_number }}
          files: 티니핑색칠놀이.apk
